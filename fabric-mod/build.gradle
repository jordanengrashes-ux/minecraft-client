plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
}

version = '1.0.0'
group   = 'com.voxelclient'

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft  "com.mojang:minecraft:1.21.4"
    mappings   "net.fabricmc:yarn:1.21.4+build.8:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.114.0+1.21.4"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

// After build, copy the JAR into the launcher's resources/mods so it gets bundled in the installer
tasks.register('copyToLauncher', Copy) {
    dependsOn jar
    from(jar.archiveFile)
    into '../resources/mods'
    rename { 'voxel-cosmetics.jar' }
}

build.finalizedBy copyToLauncher
