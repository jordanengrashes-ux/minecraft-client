<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>PvP mods</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" />
  <style>
    /* ── Tokens (same as game.html) ─────────────────────────────────────────── */
    /* No color-scheme: dark here: the window is transparent and a dark scheme
       would paint an opaque canvas behind the rounded panel. */
    :root {
      --font: 'Archivo', system-ui, 'Segoe UI', sans-serif;
      --mono: 'Cascadia Mono', Consolas, monospace;

      --bg:          #0c0c0d;
      --bg-sunk:     #08080a;
      --surface:     #141416;
      --surface-2:   #1b1b1e;
      --surface-3:   #232327;
      --line:        #222226;
      --line-strong: #323238;

      --text:   #f3f1ed;
      --text-2: #b0aca5;
      --text-3: #85817a;

      --amber:      #f5a623;
      --amber-hi:   #ffbe4d;
      --amber-ink:  #1c1203;
      --amber-wash: rgba(245, 166, 35, 0.12);
      --amber-line: rgba(245, 166, 35, 0.38);
      --danger:      #f0574b;
      --danger-wash: rgba(240, 87, 75, 0.12);
      --ok:          #4cc38a;
      --ok-wash:     rgba(76, 195, 138, 0.13);

      --radius:    8px;
      --radius-sm: 6px;
      --ease-out:  cubic-bezier(.16, 1, .3, 1);
    }

    /* ── Base ───────────────────────────────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 330px; height: 540px;
      background: transparent;
      font: 400 13px/1.45 var(--font);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
    }
    ::selection { background: rgba(245, 166, 35, 0.35); color: #fff; }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 4px; }
    button { font: inherit; color: inherit; }

    * { scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: #45454c; }
    ::-webkit-scrollbar-track, ::-webkit-scrollbar-corner { background: transparent; }

    .sprite { position: absolute; }
    .icon { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--line-strong); border-top-color: var(--amber); border-radius: 50%; animation: spin .7s linear infinite; flex-shrink: 0; }

    /* Switch (markup built by overlay.ts: label.toggle > input + .toggle-slider) */
    .toggle { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; cursor: pointer; }
    .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; background: var(--surface-3); border: 1px solid var(--line-strong); border-radius: 20px; transition: background .18s, border-color .18s; }
    .toggle-slider::before { content: ''; position: absolute; width: 14px; height: 14px; left: 2px; top: 2px; background: var(--text-3); border-radius: 50%; transition: transform .2s var(--ease-out), background .18s; }
    .toggle input:checked + .toggle-slider { background: var(--amber); border-color: var(--amber); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); background: var(--amber-ink); }
    .toggle input:focus-visible + .toggle-slider { outline: 2px solid var(--amber); outline-offset: 2px; }
    .toggle input:disabled + .toggle-slider { opacity: .5; cursor: not-allowed; }

    /* ── Panel ──────────────────────────────────────────────────────────────── */
    #overlay {
      width: 100%; height: 100%;
      display: flex; flex-direction: column; overflow: hidden;
      background: rgba(12, 12, 13, 0.96);
      border: 1px solid var(--line-strong);
      border-radius: 10px;
    }
    #header {
      flex-shrink: 0; height: 44px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 6px 0 14px;
      background: var(--bg-sunk); border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
      cursor: move;
    }
    #header-left { display: flex; align-items: center; gap: 9px; }
    .brand-mark { width: 18px; height: 18px; flex-shrink: 0; }
    #header-title { font-size: 14px; font-weight: 700; font-stretch: 92%; letter-spacing: -.005em; }
    #close-btn {
      -webkit-app-region: no-drag;
      width: 30px; height: 30px; display: grid; place-items: center;
      background: none; border: 0; border-radius: var(--radius-sm); color: var(--text-3); cursor: pointer;
      transition: background .12s, color .12s;
    }
    #close-btn .icon { width: 14px; height: 14px; }
    #close-btn:hover { background: var(--surface-2); color: var(--text); }

    #mod-list { flex: 1; overflow-y: auto; padding: 4px 6px 10px; }

    /* Rows (built by overlay.ts) */
    .group-label { padding: 14px 10px 4px; font-size: 12px; font-weight: 500; color: var(--text-3); }
    .group-label:first-child { padding-top: 8px; }

    .mod-row {
      display: flex; align-items: center; gap: 12px;
      min-height: 46px; padding: 6px 10px;
      border-radius: var(--radius-sm);
      transition: background .12s;
    }
    .mod-row:hover { background: var(--surface); }
    .mod-info  { flex: 1; min-width: 0; }
    .mod-name  { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mod-status { display: flex; align-items: center; gap: 5px; margin-top: 1px; font-size: 11.5px; color: var(--text-3); }
    .mod-sub   { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mod-status .icon { display: none; width: 12px; height: 12px; stroke-width: 2; }
    .mod-status .spinner { display: none; width: 11px; height: 11px; border-width: 1.5px; }

    .mod-row.active .mod-status { color: var(--text-2); }
    .mod-row.active .st-ok { display: block; }
    .mod-row.busy .mod-status { color: var(--text-2); }
    .mod-row.busy .spinner { display: block; }
    .mod-row.error .mod-status { align-items: flex-start; color: #ff8a80; }
    .mod-row.error .st-err { display: block; margin-top: 2px; }
    .mod-row.error .mod-sub { white-space: normal; }

    #footer {
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 14px;
      background: var(--bg-sunk); border-top: 1px solid var(--line);
    }
    #footer-note { font-size: 11.5px; color: var(--text-3); }
    #shortcut-badge { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
    kbd {
      display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px;
      border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line-strong); border-bottom-width: 2px;
      font: 500 11px/1 var(--font); color: var(--text-2);
    }
  </style>
</head>
<body>
<!-- Icons: one stroke weight, 24px grid (from game.html) -->
<svg width="0" height="0" class="sprite" aria-hidden="true">
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
</svg>

<div id="overlay">
  <div id="header">
    <div id="header-left">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 20.5 7.25 12 12 3.5 7.25Z" fill="#ffc35a"/><path d="M3.5 7.25 12 12v9.5l-8.5-4.75Z" fill="#f5a623"/><path d="M20.5 7.25 12 12v9.5l8.5-4.75Z" fill="#a8680b"/></svg>
      <div id="header-title">PvP mods</div>
    </div>
    <button id="close-btn" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
  </div>
  <div id="mod-list"></div>
  <div id="footer">
    <span id="footer-note">Changes apply on your next launch.</span>
    <span id="shortcut-badge" title="Show or hide this panel"><kbd>Shift</kbd><kbd>F9</kbd></span>
  </div>
</div>
<script type="module" src="./overlay.ts"></script>
</body>
</html>
