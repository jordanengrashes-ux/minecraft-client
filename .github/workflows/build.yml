name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: ${{ runner.os }}-electron-30
      - name: Create resource stubs
        run: New-Item -ItemType Directory -Force -Path resources/java21,resources/mods
        shell: pwsh
      - run: npm ci
      - run: npm run build && npx electron-builder --win --publish never
      - name: Publish GitHub release
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          Write-Host "Publishing $tag"
          $files = Get-ChildItem -Path release -Recurse -Include *.exe,*.blockmap,*.yml | Where-Object { $_.DirectoryName -notlike "*win-unpacked*" } | Select-Object -ExpandProperty FullName
          Write-Host "Files: $files"
          gh release delete $tag --yes 2>$null; $true
          gh release create $tag --title $tag --notes "Voxel Client $tag" --draft=false $files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
