name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: ${{ runner.os }}-electron-30
      - name: Create resource stubs
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path resources/java21,resources/mods
      - name: Inject API keys
        shell: pwsh
        run: |
          # Single-quoted: CF_API_KEY is bcrypt-shaped ($2a$10$...) and double
          # quotes would make PowerShell try to interpolate $2a/$10 as variables,
          # silently mangling the key.
          $gemini    = '${{ secrets.GEMINI_API_KEY }}'
          $cf        = '${{ secrets.CF_API_KEY }}'
          $googleId  = '${{ secrets.GOOGLE_CLIENT_ID }}'
          $googleSec = '${{ secrets.GOOGLE_CLIENT_SECRET }}'
          $enc    = New-Object System.Text.UTF8Encoding $false
          $content = "export const GEMINI_KEY = '$gemini';`nexport const CF_API_KEY = '$cf';`nexport const GOOGLE_CLIENT_ID = '$googleId';`nexport const GOOGLE_CLIENT_SECRET = '$googleSec';"
          [System.IO.File]::WriteAllText((Join-Path $PWD "src/main/ai-key.ts"), $content, $enc)
      - run: npm ci
      - run: npm run build && npx electron-builder --win --publish never
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Get-ChildItem -Path release -Recurse -Include *.exe,*.blockmap,*.yml |
            Copy-Item -Destination dist-artifacts
      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-artifacts/
          if-no-files-found: error

  publish:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: List files
        run: ls -la dist/
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release delete "$tag" --yes 2>/dev/null || true
          mapfile -d '' files < <(find dist -type f -print0)
          gh release create "$tag" \
            --title "Voxel Client $tag" \
            --notes "Voxel Client $tag" \
            "${files[@]}"
