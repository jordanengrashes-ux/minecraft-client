name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: ${{ runner.os }}-electron-30
      - name: Create resource stubs
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path resources/java21,resources/mods
      - run: npm ci
      - run: npm run build && npx electron-builder --win --publish never
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Get-ChildItem -Path release -Recurse -Include *.exe,*.blockmap,*.yml |
            Copy-Item -Destination dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-artifacts/
          if-no-files-found: error

  publish:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist
      - name: Publish GitHub release
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          echo "Publishing $tag"
          ls -la dist/
          gh release delete "$tag" --yes 2>/dev/null || true
          gh release create "$tag" \
            --title "Voxel Client $tag" \
            --notes "Voxel Client $tag" \
            dist/VoxelClient-Setup-*.exe \
            dist/*.blockmap \
            dist/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
