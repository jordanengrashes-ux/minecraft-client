name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: ${{ runner.os }}-electron-30
      - name: Create resource stubs
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path resources/java21,resources/mods
      - name: Inject Groq API key
        shell: pwsh
        run: |
          $key = "${{ secrets.GROQ_API_KEY }}"
          [System.IO.File]::WriteAllText("src/main/ai-key.ts", "export const GEMINI_KEY = '$key';", [System.Text.Encoding]::UTF8)
      - run: npm ci
      - run: npm run build && npx electron-builder --win --publish never
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Get-ChildItem -Path release -Recurse -Include *.exe,*.blockmap,*.yml |
            Copy-Item -Destination dist-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-artifacts/
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-30
      - name: Create resource stubs
        run: mkdir -p resources/java21 resources/mods
      - name: Inject Gemini API key
        run: echo "export const GEMINI_KEY = '${{ secrets.GROQ_API_KEY }}';" > src/main/ai-key.ts
      - run: npm ci
      - run: npm run build && npx electron-builder --linux --publish never
      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          find release -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.blockmap" -o -name "*.yml" \) \
            -exec cp {} dist-artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-artifacts/
          if-no-files-found: error

  build-mac:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: macos-14-electron-30-v3
      - name: Create resource stubs
        run: mkdir -p resources/java21 resources/mods
      - run: npm ci
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build && npx electron-builder --mac --publish never
      - name: Collect artifacts
        run: |
          mkdir -p dist-artifacts
          find release -type f \( -name "*.dmg" -o -name "*.blockmap" -o -name "*.yml" \) \
            -exec cp {} dist-artifacts/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: dist-artifacts/
          if-no-files-found: warn

  publish:
    needs: [build-windows, build-linux, build-mac]
    if: always() && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist/linux
      - name: Download Mac artifacts (optional)
        uses: actions/download-artifact@v4
        if: needs.build-mac.result == 'success'
        with:
          name: release-mac
          path: dist/mac
      - name: Delete existing release
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Voxel Client ${{ github.ref_name }}
          body: Voxel Client ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            dist/windows/*
            dist/linux/*
            dist/mac/*
          fail_on_unmatched_files: false
